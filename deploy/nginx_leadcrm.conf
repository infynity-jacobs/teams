# /etc/nginx/sites-available/leadcrm
# Serves the static frontend directly and reverse-proxies /api to the
# Uvicorn/FastAPI backend running on 127.0.0.1:8000.
#
# After copying this file into place:
#   sudo ln -s /etc/nginx/sites-available/leadcrm /etc/nginx/sites-enabled/leadcrm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace "your-domain.example.com" with your real hostname, and set up
# TLS (e.g. via certbot) for production use - see the README.

server {
    listen 80;
    server_name your-domain.example.com;

    client_max_body_size 20M;  # allow reasonably large XLSX uploads

    root /opt/leadcrm/frontend;
    index index.html;

    # Brand assets uploaded by administrators are served by FastAPI.
    # Nginx must proxy these URLs instead of falling through to the SPA.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
